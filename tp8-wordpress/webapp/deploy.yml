---
- name: Deployer Apache avec Docker
  hosts: prod
  become: true
  vars_files:
  - files/secrets/credentials.vault
  

  tasks:
    # Vérification du secret (sans l'afficher)
    - name: Verifier le chargement du secret
      ansible.builtin.debug:
        msg: "admin_password charge ({{ admin_password | length }} caracteres)"
    # Paquets git et wget
    - name: Installer git et wget
      ansible.builtin.yum:
        name: "{{ item }}"
        state: present
      loop:
        - git
        - wget
      when: ansible_facts['distribution'] == "CentOS"
    # Prérequis
    - name: Installer Docker et le module Python docker
      ansible.builtin.apt:
        name:
          - docker.io
          - python3-docker
        state: present
        update_cache: true

    - name: Demarrer Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
    
        # Page du site
    - name: Generer la page index.html
      ansible.builtin.template:
        src: templates/index.html.j2
        dest: /home/admin/index.html
        mode: "0644"

       # Conteneur Apache
    - name: Lancer le conteneur Apache
      community.docker.docker_container:
        name: webapp
        image: httpd
        state: started
        ports:
          - "80:80"
        volumes:
          - /home/admin/index.html:/usr/local/apache2/htdocs/index.html
